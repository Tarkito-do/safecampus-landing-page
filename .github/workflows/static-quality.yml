name: SafeCampus TB2 - pruebas de la web estatica
on:
  push:
    branches: [develop, 'feature/**']
  pull_request:
    branches: [develop, main]
permissions:
  contents: read
jobs:
  static-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Entorno de pruebas (no forma parte de la pagina web)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar sintaxis JavaScript
        run: |
          node --check js/demo-api.js
          node --check js/plataforma.js
          node --check js/mapa.js
          node --check js/menu.js
      - name: Pruebas de los flujos simulados y contratos HTML/CSS
        run: node --test tests/static.test.cjs
  browser-tests:
    runs-on: ubuntu-latest
    needs: static-tests
    steps:
      - uses: actions/checkout@v4
      - name: Entorno de pruebas (no necesario para abrir SafeCampus)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar solo el controlador de Chrome en CI
        run: npm install --prefix /tmp/safecampus-qa --no-save playwright-core@1.56.1
      - name: Servir HTML y ejecutar E2E de escritorio y móvil
        run: |
          python3 -m http.server 5500 --bind 127.0.0.1 > /tmp/safecampus-server.log 2>&1 &
          sleep 2
          NODE_PATH=/tmp/safecampus-qa/node_modules node tests/e2e.cjs
